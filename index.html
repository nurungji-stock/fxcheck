  if(window.top!==window.self){document.documentElement.innerHTML="";return;}
  function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
  var kp=crypto.subtle.importKey("raw",b64(window.__NKR),"AES-GCM",false,["decrypt"]);
  try{delete window.__NKR;}catch(e){window.__NKR=undefined;}
  var of=window.fetch.bind(window);
  window.fetch=async function(u,o){
    var r=await of(u,o), url=String(u&&u.url||u);
    var mine=url.indexOf("://")<0||url.indexOf("raw.githubusercontent.com/nurungji-stock/")>=0||HOSTS.some(function(x){return url.indexOf("//"+x)>=0||url.indexOf("."+x)>=0;});
    if(!mine||!/\.json(\?|$)/.test(url)||!r.ok) return r;
    var t=await r.text(), j=null; try{j=JSON.parse(t);}catch(e){}
    if(j&&j.enc===1&&j.iv&&j.ct){
      var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(j.iv)},await kp,b64(j.ct));
      return new Response(pt,{status:200,headers:{"content-type":"application/json"}});
    }
    return new Response(t,{status:r.status,headers:{"content-type":"application/json"}});
  };
}
