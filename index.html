<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>외국인 연속매수 체크</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--card:#fff;--fg:#1b1b1b;--muted:#6b6b6b;--line:#e3e4e8;--accent:#B8860B;--blue:#3B5BC4;--red:#C0392B;
--c1:#B8860B;--c2:#3B5BC4;--c3:#C0392B;--c4:#777;--c1bg:#FBF3E0;--c2bg:#E8EDFA;--c3bg:#FBE6E3;--c4bg:#EEE}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15161a;--card:#1f2026;--fg:#ececec;--muted:#9a9a9a;--line:#33343a;--c1bg:#3a3012;--c2bg:#1d2648;--c3bg:#45201c;--c4bg:#333}}
:root[data-theme="dark"]{--bg:#15161a;--card:#1f2026;--fg:#ececec;--muted:#9a9a9a;--line:#33343a;--c1bg:#3a3012;--c2bg:#1d2648;--c3bg:#45201c;--c4bg:#333}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:22px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}.legend b{color:var(--fg)}
.sbox{position:relative}
input{width:100%;padding:14px 16px;font:inherit;font-size:18px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);outline:none}
input:focus{border-color:var(--blue)}
#sugg{position:absolute;left:0;right:0;top:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:6px;max-height:60vh;overflow:auto;z-index:5;display:none;box-shadow:0 8px 24px rgba(0,0,0,.12)}
#sugg div{padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px}
#sugg div:last-child{border-bottom:0}#sugg div:hover{background:var(--bg)}
.tag{font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.t1{background:var(--c1bg);color:var(--c1)}.t2{background:var(--c2bg);color:var(--c2)}.t3{background:var(--c3bg);color:var(--c3)}.t4{background:var(--c4bg);color:var(--c4)}
.name{font-size:22px;font-weight:700}.code{color:var(--muted);font-size:13px;font-weight:400;margin-left:6px}
.verdict{font-size:19px;font-weight:700;margin:6px 0 4px}.vh{color:var(--blue)}.vm{color:var(--accent)}.vl{color:var(--muted)}
.meta{color:var(--muted);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:13px;margin-top:10px}th{color:var(--muted);font-weight:500;text-align:right;padding:4px 2px;border-bottom:1px solid var(--line)}td{text-align:right;padding:6px 2px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}.up{color:var(--red)}.dn{color:var(--blue)}
.act{margin-top:10px;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:14px}
.filt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.filt button{font:inherit;font-size:13px;padding:5px 12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.filt button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;gap:8px}.row:last-child{border-bottom:0}
.row .l{display:flex;align-items:center;gap:8px;min-width:0}.row .n{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{font-size:13px;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:12px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.g div{background:var(--bg);border-radius:10px;padding:8px 10px}.g b{display:block;font-size:20px}.g small{color:var(--muted);font-size:12px}.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.rk{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.rk:last-child{border-bottom:0}.rk .no{width:26px;font-weight:700;color:var(--muted);text-align:center}.rk .nm{flex:1;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rk .sc{font-weight:700;color:var(--red);white-space:nowrap}.rk .sub{font-size:12px;color:var(--muted);white-space:nowrap}.blur{filter:blur(6px);user-select:none;pointer-events:none;color:var(--fg)}.lock{display:inline-block;font-size:12px;color:var(--accent);margin-left:6px}.hook{margin-top:10px;padding:12px 14px;background:var(--c1bg);color:var(--c1);border-radius:10px;font-size:14px;font-weight:500;line-height:1.7}
.foot{color:var(--muted);font-size:12px;margin-top:16px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
<h1>외국인 연속매수 체크</h1>
<p class="sub" id="upd">불러오는 중…</p>

<div class="card legend"><span><b>●</b> 3일 연속 순매수 = 진짜 수급</span><span><b>◐</b> 1~2일째 = 확인 전</span><span><b>○</b> 순매도 = 안 들어옴</span><span><b>0선</b> = MACD 0선 상향돌파 3일 내</span><span><b>바닥 점수</b> = 이격도·RSI·투매거래량·외국인 소진 중 몇 개</span></div>

<div class="card" id="gauge" style="display:none"></div>
<div class="sbox"><input id="q" placeholder="종목명 입력 (코스피·코스닥 전 종목)" autocomplete="off"><div id="sugg"></div></div>

<div class="card" id="verdict" style="display:none;margin-top:12px"></div>
<div class="card" id="rank" style="display:none;margin-top:12px"></div>

<div class="card" style="margin-top:12px">
<div class="filt" id="filt"></div>
<div id="list"></div>
</div>

<p class="foot">네이버 금융 투자자별 매매동향 기준, 평일 장중 10분마다 자동 갱신. 장중 수치는 잠정치라 저녁 6시 이후 마감 집계가 정확합니다. 코스피·코스닥 전 종목.</p>
</div>
<script>
const CAT={0:{l:"분류 없음",c:"t4",act:"분류기에 없는 종목입니다. 외국인 수급만 참고하세요 — 사흘 연속이면 들고 가고, 안 들어온 반등은 반등 때 정리."},
1:{l:"① 실적 대형주",c:"t1",act:"들고 갑니다. 외국인이 돌아올 때 가장 먼저 받는 자리. 29일 삼성전자 실적 전까지 비중은 늘리지 않습니다."},
2:{l:"② 재료 장비·소부장",c:"t2",act:"들고 갑니다. 확정된 수요가 있는 종목이라 반등 때 가장 먼저 움직입니다. 외국인 사흘 연속이면 물타기 가능."},
3:{l:"③ 테마 중소형주",c:"t3",act:"반등 때 정리합니다. 본전이 아니라 반등이 기준(−20%가 −10%로 올라온 날). 외국인 안 들어온 급등은 갭상승 후 조정입니다."},
4:{l:"? 판단 필요",c:"t4",act:"확정 재료가 확인되기 전까지는 ③처럼 대응합니다."}};
const HIDE_TOP=3;                       // 상위 몇 종목을 가릴지
const HOOK_LINK="https://docs.google.com/forms/d/e/1FAIpQLSfwjeWhSGrFjBdtnWSijc4xu_PPPzxVUcUr9-h21Sgx8L8k7w/viewform";   // 안내 링크
const HOOK_TEXT=`1~3위 종목이 궁금하시면<br>
<a href="${HOOK_LINK}" target="_blank" rel="noopener" style="color:inherit;font-weight:700;text-decoration:underline">랭크 TOP3 확인하기</a><br>
이 링크 누르고 다음 페이지 종목명 입력칸에<br>
<b>오늘날짜/대장</b> 이라고 적어서 보내주세요<br>
순차적으로 안내 도와드리겠습니다`;   // 여기 문구 바꾸면 됨
const RANK_N=20;                        // 랭킹에 보여줄 개수
const RANK_MIN_RISE=20;                 // 섹터 태그 없는 종목은 올해 고점까지 +N% 이상 올랐어야 랭킹에 들어감
const LEAD_SECTORS=["반도체","반도체장비","소부장","2차전지","ESS","전력","원전","조선","로봇","우주","광통신","양자보안","유리기판","AI","바이오","방산"];   // 최근 주도 섹터 — 여기 넣고 빼면 됨
const norm=s=>(s||"").replace(/\s+/g,"").toLowerCase();
const fmt=v=>{v=Math.round(v);return (v>0?"+":"")+v.toLocaleString()};
const vcls=m=>m==="●"?"vh":m==="◐"?"vm":"vl";
let D=null, filt="hot", mkt="all";
fetch("data.json?t="+Date.now()).then(r=>r.json()).then(d=>{
  D=d; D.rows=d.rows.map(r=>Array.isArray(r)?{name:r[0],cat:r[1],code:r[2],mkt:r[3],mark:r[4],txt:r[5],st:r[6],ss:r[7],s3:r[8],s5:r[9],
    days:r[10].map(x=>({d:x[0],close:x[1],rate:x[2],inst:x[3],frgn:x[4],hold:x[5]})),macd:r[11]||null,bot:r[12]||null,sec:r[13]||""}:r);
  init();
}).catch(()=>{document.getElementById("upd").textContent="데이터를 불러오지 못했습니다. 잠시 후 다시 열어주세요.";});

function init(){
  document.getElementById("upd").textContent=`${D.updated} 갱신 · 기준일 ${D.base} · ${D.count.toLocaleString()}종목`;
  const F=document.getElementById("filt");
  const mk=(k,l,group)=>{const b=document.createElement("button");b.textContent=l;b.dataset.k=k;b.dataset.g=group;
    if((group==="f"&&k===filt)||(group==="m"&&k===mkt))b.classList.add("on");
    b.onclick=()=>{if(group==="f")filt=k;else mkt=k;[...F.children].forEach(x=>{if(x.dataset.g===group)x.classList.toggle("on",x.dataset.k===k)});renderList();};F.appendChild(b);};
  [["hot","● 3일 연속"],["half","◐ 들어오는 중"],["macd","MACD 0선 돌파"],["hotmacd","● + 0선 돌파"],["bot","바닥 3점+"],["all","전체"],["1","①"],["2","②"],["3","③"],["4","?"]].forEach(([k,l])=>mk(k,l,"f"));
  const sep=document.createElement("span");sep.style.cssText="width:100%;height:0";F.appendChild(sep);
  [["all","코스피+코스닥"],["코스피","코스피"],["코스닥","코스닥"]].forEach(([k,l])=>mk(k,l,"m"));
  renderGauge();
  renderRank();
  renderList();
  const q=document.getElementById("q");
  const h=location.hash.slice(1); if(h){const r=D.rows.find(x=>norm(x.name)===norm(decodeURIComponent(h)));if(r)show(r);}
  q.focus();
}
function renderGauge(){
  const g=D.gauge; if(!g) return; const G=document.getElementById("gauge"); G.style.display="block";
  const panic=Math.max(g.rsi30, g.low20*0.8);   // RSI 30 밑 비율과 20일 신저가 비율(0.8 가중) 중 큰 쪽
  const lvl=panic>=40?["패닉 극단 — 역사적으로 바닥 근처","var(--red)"]:panic>=25?["투매 구간 — 바닥 가까움","var(--accent)"]:panic>=12?["조정 중","var(--muted)"]:["정상","var(--muted)"];
  const pct=v=>Math.min(100,v*2);
  G.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px"><b style="font-size:16px">시장 패닉 게이지</b><span style="color:${lvl[1]};font-weight:700">${lvl[0]}</span></div>
<div class="g"><div><b>${g.rsi30}%</b><small>RSI 30 밑 종목</small><div class="bar"><i style="width:${pct(g.rsi30)}%"></i></div></div>
<div><b>${g.low20}%</b><small>20일 신저가</small><div class="bar"><i style="width:${pct(g.low20)}%"></i></div></div>
<div><b>${g.kospi_gap!=null?g.kospi_gap:g.median_gap}</b><small>${g.kospi_gap!=null?"코스피 이격도(20일)":"전종목 이격도 중간값"}</small><div class="bar"><i style="width:${Math.max(0,Math.min(100,(110-(g.kospi_gap!=null?g.kospi_gap:g.median_gap))*5))}%"></i></div></div></div>
<div class="meta" style="margin-top:8px">바닥 점수 3점 이상 ${g.score3.toLocaleString()}종목 · 이격도 90 밑 ${g.gap90}% · 평소엔 RSI 30 밑이 5~10%, 패닉 바닥은 40~50%</div>`;
}
let rankMkt="코스닥";
function renderRank(){
  const R=document.getElementById("rank");
  const hasM=D.rows.some(r=>r.bot&&r.bot.length>10);
  const lead=r=>r.sec?LEAD_SECTORS.includes(r.sec):(hasM&&r.bot[9]>=RANK_MIN_RISE);   // 주도 섹터 종목, 또는 섹터 태그 없으면 올해 고점까지 많이 올랐던 종목
  const ok=r=>r.bot&&!r.bot[6]&&r.mkt===rankMkt&&(r.bot[8]==null||r.bot[8]>=30)&&lead(r);   // 사건 종목 제외 · 거래대금 30억↑ · 주도 섹터
  const hasT=D.rows.some(r=>r.bot&&r.bot.length>11);
  const rows=D.rows.filter(ok).sort((a,b)=>hasT?(b.bot[11]-a.bot[11]||b.bot[0]-a.bot[0]):(b.bot[0]-a.bot[0]||(hasM?b.bot[9]-a.bot[9]:0)||a.bot[2]-b.bot[2])).slice(0,RANK_N);
  R.style.display="block";
  const fake=["■■■■■","■■■■","■■■■■■"];
  const tabs=["코스닥","코스피"].map(m=>`<button data-m="${m}" style="font:inherit;font-size:13px;padding:5px 14px;border-radius:14px;border:1px solid var(--line);background:${m===rankMkt?"var(--fg)":"var(--card)"};color:${m===rankMkt?"var(--bg)":"var(--fg)"};cursor:pointer">${m}</button>`).join(" ");
  R.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px"><b style="font-size:16px">바닥 점수 랭킹</b><span>${tabs}</span></div>
<div class="meta" style="margin:4px 0 2px">최근 주도 섹터만 · 종합점수 100점 (이격도 30 · RSI 25 · 거래량·꼬리 20 · 외국인 10 · 주도주 15) · 회사 사건·거래 없는 종목 제외</div>`+
    (rows.length?rows.map((r,i)=>{const hid=i<HIDE_TOP;
      return `<div class="rk"${hid?"":` data-n="${r.name}" style="cursor:pointer"`}><span class="no">${i+1}</span>
<span class="nm">${hid?`<span class="blur">${fake[i%3]}</span><span class="lock">🔒 비공개</span>`:`${r.name} <span class="tag ${CAT[r.cat].c}">${r.cat?CAT[r.cat].l.slice(0,1):"·"}</span>${r.sec?` <small style="color:var(--muted)">${r.sec}</small>`:""}`}</span>
<span class="sub">${hid?"":`${r.bot[9]!=null?`고점까지 +${r.bot[9]}% · `:""}이격도 ${r.bot[2]} · RSI ${r.bot[1]}`}</span><span class="sc">${hid?`<span class="blur">■■점</span>`:(hasT?r.bot[11]+"점":r.bot[0]+"점")}</span></div>`;}).join(""):`<div class="empty">조건에 맞는 종목이 없습니다</div>`)+
    `<div class="hook">${HOOK_TEXT}</div>`;
  R.querySelectorAll("button[data-m]").forEach(b=>b.onclick=()=>{rankMkt=b.dataset.m;renderRank();});
  R.querySelectorAll(".rk[data-n]").forEach(e=>e.onclick=()=>{const r=D.rows.find(x=>x.name===e.dataset.n);show(r);window.scrollTo({top:0,behavior:"smooth"});});
}
function renderList(){
  const L=document.getElementById("list");
  const zc=r=>r.macd&&r.macd[2]>=0&&r.macd[2]<=2;
  let rows=D.rows.filter(r=>(mkt==="all"||r.mkt===mkt)&&(filt==="all"||(filt==="hot"?r.mark==="●":filt==="half"?r.mark==="◐":filt==="macd"?zc(r):filt==="hotmacd"?(zc(r)&&r.mark==="●"):filt==="bot"?(r.bot&&r.bot[0]>=3&&!r.bot[6]):r.cat==+filt)));
  if(filt==="bot") rows=rows.slice().sort((a,b)=>b.bot[0]-a.bot[0]||a.bot[2]-b.bot[2]);
  if(filt==="macd"||filt==="hotmacd") rows=rows.slice().sort((a,b)=>a.macd[2]-b.macd[2]||b.st-a.st);
  const total=rows.length; rows=rows.slice(0,300);
  if(!total){L.innerHTML=`<div class="empty">${filt==="hot"?"외국인이 사흘 연속 산 종목이 없습니다":filt==="macd"||filt==="hotmacd"?"최근 3일 안에 MACD 0선을 올라탄 종목이 없습니다":filt==="bot"?"바닥 점수 3점 이상 종목이 없습니다":"없음"}</div>`;return;}
  L.innerHTML=`<div class="meta" style="padding:0 0 6px">${total.toLocaleString()}종목${total>300?" (상위 300개 표시, 나머지는 검색)":""}</div>`+rows.map(r=>`<div class="row" data-n="${r.name}"><div class="l"><span class="tag ${CAT[r.cat].c}">${r.cat?CAT[r.cat].l.slice(0,1):"·"}</span><span class="n">${r.name}</span></div>
<div class="r">${r.bot&&r.bot[6]?`<span class="tag" style="background:var(--c4bg);color:var(--c4)">제외</span> `:r.bot&&r.bot[0]>=3?`<span class="tag" style="background:var(--c3bg);color:var(--c3)">바닥 ${r.bot[0]}점</span> `:""}${zc(r)?`<span class="tag" style="background:var(--c1bg);color:var(--c1)">0선 ${r.macd[2]===0?"오늘":r.macd[2]+"일 전"}</span> `:""}<span class="${vcls(r.mark)}">${r.mark} ${r.txt}</span> <span class="${r.days[0].frgn>0?"up":"dn"}">${fmt(r.days[0].frgn)}</span></div></div>`).join("");
  L.querySelectorAll(".row").forEach(e=>e.onclick=()=>{const r=D.rows.find(x=>x.name===e.dataset.n);show(r);window.scrollTo({top:0,behavior:"smooth"});});
}
const BAD={1:"평균보다 25% 넘게 빠짐 — 수급이 아니라 회사 사건",2:"두 달 새 40% 넘게 빠짐 — 회사 사건",3:"거래가 거의 없는 종목"};
function bottomLine(r){
  const b=r.bot; if(!b) return "";
  if(b[6]) return `<div style="margin:2px 0 6px"><b style="color:var(--muted);font-size:16px">바닥 점수 제외</b> <span class="tag" style="background:var(--c4bg);color:var(--c4)">${BAD[b[6]]}</span>
<div class="meta" style="margin-top:4px">이격도 ${b[2]} · RSI ${b[1]}${b[7]!=null?` · 60일 고점 대비 −${b[7]}%`:""} — 점수 공식이 안 맞는 종목이라 수급·실적으로 따로 봐야 합니다.</div></div>`;
  const lead=b.length>10?`<div class="meta" style="margin-top:4px">6개월 전 대비 최근 고점 <b style="color:${b[9]>=20?"var(--red)":"var(--muted)"}">+${b[9]}%</b> · 고점에서 −${b[7]}% · 120일선 ${b[10]?"<b>위</b> (추세 살아있음)":"아래 (추세 꺾임)"}</div>`:"";
  const chip=(on,l)=>`<span class="tag" style="background:${on?"var(--c3bg)":"var(--bg)"};color:${on?"var(--c3)":"var(--muted)"}">${on?"✓":"·"} ${l}</span>`;
  const col=b[0]>=3?"var(--red)":b[0]===2?"var(--accent)":"var(--muted)";
  return `<div style="margin:2px 0 6px"><b style="color:${col};font-size:16px">바닥 점수 ${b[0]} / 4</b>${b.length>11?` <span class="meta">· 종합 <b>${b[11]}점</b>/100</span>`:""}
<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px">${chip(b[2]<=90,`이격도 ${b[2]}`)}${chip(b[1]<=30,`RSI ${b[1]}`)}${chip(b[3],"투매거래량+아래꼬리")}${chip(b[4],"외국인 매도 소진")}</div>${lead}</div>`;
}
function macdLine(r){
  const m=r.macd; if(!m) return "";
  const ago=n=>n===0?"오늘":n+"일 전";
  let s=m[4]?`MACD 0선 <b style="color:var(--red)">위</b>`:`MACD 0선 <b style="color:var(--blue)">아래</b>`;
  if(m[2]>=0) s+=` · <b style="color:var(--accent)">0선 상향돌파 ${ago(m[2])}</b>`;
  if(m[3]>=0) s+=` · 시그널 골든크로스 ${ago(m[3])}`;
  return `<div class="meta" style="margin-bottom:2px">${s} <span style="opacity:.6">(${m[5].slice(5)} 종가 기준)</span></div>`;
}
function show(r){
  const V=document.getElementById("verdict"); V.style.display="block";
  const c=CAT[r.cat], t=r.days[0];
  V.innerHTML=`<div><span class="name">${r.name}<span class="code">${r.code}${r.mkt?" · "+r.mkt:""}${r.sec?" · "+r.sec:""}</span></span> <span class="tag ${c.c}">${c.l}</span></div>
<div class="verdict ${vcls(r.mark)}">${r.mark} ${r.txt}</div>
${bottomLine(r)}${macdLine(r)}<div class="meta">외국인 3일합 ${fmt(r.s3)}주 · 5일합 ${fmt(r.s5)}주 · 오늘 기관 ${fmt(t.inst)}주 · 외인 보유율 ${t.hold.toFixed(2)}%</div>
<table><tr><th>날짜</th><th>종가</th><th>등락률</th><th>기관</th><th>외국인</th></tr>${r.days.map(d=>`<tr><td>${d.d.slice(5)}</td><td>${d.close.toLocaleString()}</td><td class="${d.rate>0?"up":d.rate<0?"dn":""}">${d.rate.toFixed(2)}%</td><td class="${d.inst>0?"up":"dn"}">${fmt(d.inst)}</td><td class="${d.frgn>0?"up":"dn"}"><b>${fmt(d.frgn)}</b></td></tr>`).join("")}</table>
<div class="act">${c.act}</div>`;
  history.replaceState(null,"","#"+encodeURIComponent(r.name));
  document.getElementById("sugg").style.display="none";
}
const q=document.getElementById("q"), S=document.getElementById("sugg");
q.addEventListener("input",()=>{
  if(!D)return; const k=norm(q.value); if(!k){S.style.display="none";return;}
  const ex=D.rows.filter(r=>norm(r.name)===k), inc=D.rows.filter(r=>norm(r.name)!==k&&norm(r.name).includes(k)).slice(0,15);
  const list=[...ex,...inc];
  if(!list.length){S.innerHTML=`<div class="empty">'${q.value}' 종목을 못 찾았습니다</div>`;S.style.display="block";return;}
  S.innerHTML=list.map(r=>`<div data-n="${r.name}"><span>${r.name} <small style="color:var(--muted)">${r.mkt||""}</small></span><span><span class="tag ${CAT[r.cat].c}">${r.cat?CAT[r.cat].l.slice(0,1):"·"}</span> <span class="${vcls(r.mark)}" style="font-size:13px">${r.mark} ${r.txt}</span></span></div>`).join("");
  S.style.display="block";
  S.querySelectorAll("div[data-n]").forEach(e=>e.onclick=()=>{const r=D.rows.find(x=>x.name===e.dataset.n);q.value=r.name;show(r);});
});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const f=S.querySelector("div[data-n]");if(f)f.click();}});
document.addEventListener("click",e=>{if(!e.target.closest(".sbox"))S.style.display="none";});
</script>
</body>
</html>
