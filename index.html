if(!okHost){stop("허용되지 않은 주소입니다."); return;}
function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function tob64(u){var s="";for(var i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
async function derive(pw){
  var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  var bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:new TextEncoder().encode(SALT),iterations:IT,hash:"SHA-256"},base,256);
  return new Uint8Array(bits);
}
async function openWith(raw){
  var k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.iv)},k,b64(P.ct));
  return new TextDecoder().decode(pt);
}
function show(html,raw){
  if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){show(html,raw);},{once:true});return;}
  var gs=document.getElementById("nkgs"); if(gs) gs.remove();
  var inj="<script>window.__NKR="+JSON.stringify(tob64(raw))+";window.__NKH="+JSON.stringify(HOSTS)+";("+patch.toString()+")();<\/script>";
  html=html.replace(/<head[^>]*>/i,function(m){return m+inj;});
  document.body.className="";document.open();document.write(html);document.close();
}
// 잠긴 데이터(json)를 열쇠로 자동으로 풀어주는 장치 (풀린 페이지 안에서 실행됨)
function patch(){
  var HOSTS=window.__NKH||[];
  if(window.top!==window.self){document.documentElement.innerHTML="";return;}
  function b64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
  var kp=crypto.subtle.importKey("raw",b64(window.__NKR),"AES-GCM",false,["decrypt"]);
  try{delete window.__NKR;}catch(e){window.__NKR=undefined;}
  var of=window.fetch.bind(window);
  window.fetch=async function(u,o){
    var r=await of(u,o), url=String(u&&u.url||u);
    var mine=url.indexOf("://")<0||url.indexOf("raw.githubusercontent.com/nurungji-stock/")>=0||HOSTS.some(function(x){return url.indexOf("//"+x)>=0||url.indexOf("."+x)>=0;});
    if(!mine||!/\.json(\?|$)/.test(url)||!r.ok) return r;
    var t=await r.text(), j=null; try{j=JSON.parse(t);}catch(e){}
    if(j&&j.enc===1&&j.iv&&j.ct){
      var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(j.iv)},await kp,b64(j.ct));
      return new Response(pt,{status:200,headers:{"content-type":"application/json"}});
    }
    return new Response(t,{status:r.status,headers:{"content-type":"application/json"}});
  };
}
async function tryStored(){
  try{var s=localStorage.getItem(LS); if(!s) return false; var raw=b64(s); show(await openWith(raw),raw); return true;}
  catch(e){try{localStorage.removeItem(LS);}catch(_){} return false;}
}
document.getElementById("f").onsubmit=async function(ev){
  ev.preventDefault(); var b=document.getElementById("b"), e=document.getElementById("e");
  b.disabled=true; b.textContent="확인 중…"; e.textContent="";
  try{
    var raw=await derive(document.getElementById("pw").value);
    var html=await openWith(raw);
    if(document.getElementById("rm").checked){try{localStorage.setItem(LS,tob64(raw));}catch(_){}}
    show(html,raw);
  }catch(err){e.textContent="비밀번호가 맞지 않아요."; b.disabled=false; b.textContent="들어가기";}
};
tryStored();
})();
