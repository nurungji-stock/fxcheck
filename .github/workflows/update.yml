name: update
on:
  schedule:
    - cron: "*/10 0-9 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas lxml html5lib beautifulsoup4
      - run: python fetch.py
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add data.json codes.json && (git commit -m "update $(date -u +%H:%M)" && git push) || echo "no change"
