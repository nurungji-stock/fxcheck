name: picks
on:
  schedule:
    - cron: "10 9 * * 1-5"     # 평일 18:10 KST (외국인·기관 수치 확정 뒤)
    - cron: "40 10 * * 1-5"    # 19:40 KST 한 번 더 (첫 번째가 실패했을 때 대비, 이미 했으면 그대로)
  workflow_dispatch:
permissions:
  contents: write
concurrency: update            # 기존 update 작업과 겹치지 않게 순서대로
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests pandas lxml html5lib beautifulsoup4
      - run: python picks.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}     # 선택: 관심 종목을 텔레그램으로 받기
          TG_CHAT: ${{ secrets.TG_CHAT }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add picks.json && (git commit -m "picks $(date -u +%F)" && git pull --rebase && git push) || echo "no change"
